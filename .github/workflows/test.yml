name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TEMP_DIR: build/ci
  CMAKE_BUILD_PARALLEL_LEVEL: "3"
  EGL_PLATFORM: "surfaceless"
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  build-and-test:
    name: ${{ matrix.name }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            os: ubuntu-24.04
            arch: x86_64
          - name: macOS ARM64
            os: macos-15
            arch: arm64

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build and rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            libcurl4-openssl-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgl1-mesa-dri \
            libicu-dev \
            libjpeg-dev \
            libopengl-dev \
            libpng-dev \
            libprotobuf-dev \
            libuv1-dev \
            libwebp-dev \
            ninja-build \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew untap aws/tap || true
          brew install ccache ninja

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', '.gitmodules') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --max-size=2G
          ccache --zero-stats

      - name: Build pymgl
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          python -m pip install --upgrade pip
          python -m pip install --verbose --editable ".[test]"

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: |
          unset DISPLAY
          python ci/headless_egl_smoke.py
          python -m pytest -q

      - name: Run tests on macOS
        if: runner.os == 'macOS'
        run: python -m pytest -q

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
