name: Build and publish wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish after successful wheel tests (leave empty for artifacts only)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CIBW_BUILD: "cp313-*"
  CIBW_BUILD_VERBOSITY: "1"
  CIBW_SKIP: "*-musllinux_*"
  CIBW_TEST_REQUIRES: "pytest Pillow numpy pixelmatch python-dotenv"
  CIBW_TEST_COMMAND_LINUX: >-
    xvfb-run -a --server-args="-screen 0 1024x768x24 -ac +render -noreset"
    python -m pytest --pyargs pymgl -q
  CIBW_TEST_COMMAND_MACOS: "python -m pytest --pyargs pymgl -q"
  CIBW_BEFORE_ALL_LINUX: >-
    dnf install -y
    cmake
    ninja-build
    pkgconfig
    libcurl-devel
    libjpeg-turbo-devel
    libpng-devel
    libwebp-devel
    libuv-devel
    libX11-devel
    mesa-libGL-devel
    mesa-libEGL-devel
    mesa-dri-drivers
    xorg-x11-server-Xvfb
  CIBW_ENVIRONMENT_LINUX: >-
    CMAKE_BUILD_PARALLEL_LEVEL=3
    LIBGL_ALWAYS_SOFTWARE=1
  CIBW_ENVIRONMENT_MACOS: >-
    CMAKE_BUILD_PARALLEL_LEVEL=3
    MACOSX_DEPLOYMENT_TARGET=12.0

jobs:
  build-wheels:
    name: ${{ matrix.name }} / CPython 3.13
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew untap aws/tap || true
          brew install ninja

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: pymgl-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          compression-level: 0
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-wheels
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pymgl-wheel-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "${RELEASE_TAG}"
          dist/*.whl
          dist/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --title "pymgl ${RELEASE_TAG}"
          --generate-notes
          --verify-tag
